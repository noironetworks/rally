- job:
    name: rally-tox-base
    parent: unittests
    pre-run: tests/ci/playbooks/tox-install.yaml
    run: tests/ci/playbooks/tox-run.yaml
    post-run: tests/ci/playbooks/fetch-html-and-json-reports.yaml
    description: |
      Run test for rally project.
    nodeset: ubuntu-noble

- job:
    name: rally-tox-pep8
    parent: rally-tox-base
    description: |
      Run test for rally project.

      Uses tox with the ``self`` environment.
    vars:
      tox_env: pep8

- job:
    name: rally-tox-functional
    parent: rally-tox-base
    description: |
      Run test for rally project.

      Uses tox with the ``functional`` environment.
    vars:
      tox_env: functional

- job:
    name: rally-tox-functional-mariadb
    parent: rally-tox-functional
    description: |
      Run functional tests for rally project against MariaDB.

      Uses tox with the ``functional`` environment. Every test gets its own
      database on the MariaDB server.
    pre-run: tests/ci/playbooks/functional-db-setup.yaml
    vars:
      rally_functional_db: mariadb
      tox_environment:
        RALLY_FUNCTIONAL_DB_URL: "mysql+pymysql://rally:rally@127.0.0.1/"

- job:
    name: rally-tox-functional-py314-postgresql
    parent: rally-tox-functional
    description: |
      Run functional tests for rally project against PostgreSQL.

      Uses tox with the ``functional`` environment under Python 3.14. Every
      test gets its own database on the PostgreSQL server.
    pre-run: tests/ci/playbooks/functional-db-setup.yaml
    nodeset: ubuntu-resolute-8GB
    vars:
      python_exec: python3.14
      rally_functional_db: postgresql
      tox_environment:
        RALLY_FUNCTIONAL_DB_URL: "postgresql+psycopg://rally:rally@127.0.0.1/postgres"

- job:
    name: rally-tox-self
    parent: rally-tox-base
    description: |
      Run test for rally project.

      Uses tox with the ``self`` environment.
    vars:
      tox_env: self

- job:
    name: rally-tox-self-py314
    parent: rally-tox-self
    description: |
      Run test for rally project.

      Uses tox with the ``self`` environment under Python 3.14.
    nodeset: ubuntu-resolute-8GB
    vars:
      python_exec: python3.14

- job:
    name: rally-tox-py311
    parent: rally-tox-base
    description: |
      Run unit test for rally project.

      Uses tox with the ``py311`` environment.
    vars:
      tox_env: py311
    nodeset: debian-bookworm

- job:
    name: rally-tox-py312
    parent: rally-tox-base
    description: |
      Run unit test for rally project.

      Uses tox with the ``py312`` environment.
    vars:
      tox_env: py312

- job:
    name: rally-tox-py313
    parent: rally-tox-base
    description: |
      Run unit test for rally project.

      Uses tox with the ``py313`` environment.
    vars:
      tox_env: py313
    nodeset: debian-trixie-8GB

- job:
    name: rally-tox-py314
    parent: rally-tox-base
    description: |
      Run unit test for rally project.

      Uses tox with the ``py314`` environment.
    vars:
      tox_env: py314
    nodeset: ubuntu-resolute-8GB

- job:
    name: rally-tox-mypy
    parent: rally-tox-base
    vars:
      tox_env: mypy

- job:
    name: rally-tox-samples
    parent: rally-tox-base
    description: |
      Run unit test for rally project.

      Uses tox with the ``samples`` environment.
    vars:
      tox_env: samples

- job:
    name: rally-tox-cover
    parent: tox-cover
    description: |
      Run test for rally project.

      Uses tox with the ``cover`` environment.
    vars:
      coverage_output_src: '{{ zuul.project.src_dir }}/cover/'
      zuul_executor_dest: '{{ zuul.executor.log_root }}/coverage/'
      ensure_tox_version: '!=4.67.5'

- job:
    name: rally-tox-zuul-ansible-lint
    parent: rally-tox-py312
    vars:
      tox_env: zuul-ansible-lint
